name: quality
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    # Cleanup must inspect every same-user cwd and fail closed on unreadable
    # processes. Keep unrelated hosted-runner processes outside its /proc view.
    # Keep Python built for Bookworm rather than using a host-toolcache binary
    # whose GLIBC requirement can exceed the container's version.
    container: python:3.11-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - run: make prepare
      - run: make check
      - run: make test-race
      - run: make security
      - run: make prove-quality
      - run: make build
