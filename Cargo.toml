[workspace]
members = ["crates/tandem-core", "crates/tandem-engine", "crates/tandem-opencode", "crates/tandem-store", "crates/tandem-workspace"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/samjingwen/tandem"
publish = false

[workspace.dependencies]
async-trait = "=0.1.92"
event-listener = "=5.4.2"
futures-util = "=0.3.34"
getrandom = "=0.4.3"
mime = "=0.3.17"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
pollster = "=0.4.0"
# Independent test reader shares SQLx's supported native SQLite ABI.
rusqlite = { version = "=0.39.0", features = ["bundled"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite", "macros"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value", "arbitrary_precision"] }
sha2 = "=0.11.1"
tempfile = "=3.27.0"
time = { version = "=0.3.55", features = ["formatting", "parsing", "large-dates"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
tandem-core = { path = "crates/tandem-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.release.build-override]
# Host proc-macro dylibs must remain loadable by rustc on macOS. Stripping the
# SQLx macro dylib corrupts its LINKEDIT pool; final release artifacts keep the
# independent strip policy above.
strip = "none"
